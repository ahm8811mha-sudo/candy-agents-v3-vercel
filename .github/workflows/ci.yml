name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee eslint-output.log

      - name: TypeScript
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typescript-output.log

      - name: Unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest-output.log

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            typescript-output.log
            vitest-output.log
            eslint-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: npm run build

      - name: Production security smoke
        run: npm run test:smoke

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  # The migrations the production build applies, applied first to a throwaway
  # Postgres with the same tool, and their rollback-only suites run against it.
  release-migrations:
    name: Release migrations on a throwaway Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply the release migrations and run their suites
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: scripts/sql-local-check.sh
